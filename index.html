<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edu Sampada</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#18304b}
header{background:#102b50;color:white;text-align:center;padding:30px 15px}
header h1{margin:0;font-size:34px;letter-spacing:2px}
header p{color:#d5e3f4}
main{max-width:1000px;margin:30px auto;padding:15px}
h2{color:#153c68}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}
.card{background:white;padding:22px;border-radius:12px;border:1px solid #e1e7ef;cursor:pointer}
.card:hover{border-color:#276ba5}
.card h3{color:#174d80}
button{background:#174d80;color:white;padding:11px 17px;border:0;border-radius:7px;cursor:pointer}
.subject{background:white;padding:18px;margin:12px 0;border-radius:10px;border:1px solid #e1e7ef}
.price{color:#16834b;font-weight:bold}
.hidden{display:none}
.note{color:#68768a;font-size:14px}
footer{text-align:center;padding:25px;color:#65748b}
</style>
</head>
<body>

<header>
<h1>EDU SAMPADA</h1>
<p>Your Learning Destination</p>
<p>VTU Engineering Notes and Study Materials</p>
</header>

<main>

<section id="branchPage">
<h2>Select Your Engineering Branch</h2>
<div class="grid" id="branchList"></div>
</section>

<section id="schemePage" class="hidden">
<button onclick="showPage('branchPage')">← Back</button>
<h2 id="schemeHeading">Select Scheme</h2>
<div class="grid" id="schemeList"></div>
</section>

<section id="semesterPage" class="hidden">
<button onclick="showPage('schemePage')">← Back</button>
<h2 id="semesterHeading">Select Semester</h2>
<div class="grid" id="semesterList"></div>
</section>

<section id="subjectPage" class="hidden">
<button onclick="showPage('semesterPage')">← Back</button>
<h2 id="subjectHeading">Select Subject</h2>
<p class="note">Choose a subject to explore its study materials.</p>
<div id="subjectList"></div>
</section>

</main>

<footer>
<p>© 2026 Edu Sampada. All Rights Reserved.</p>
<p>Learn Better. Achieve More.</p>
</footer>

<script>

const branches = [
"ECE",
"CSE",
"Civil Engineering",
"Mechanical Engineering"
];

let selectedBranch = "";
let selectedScheme = "";
let selectedSemester = 0;

function createCard(title, description, action, container) {
const card = document.createElement("div");
card.className = "card";

const heading = document.createElement("h3");
heading.textContent = title;

const paragraph = document.createElement("p");
paragraph.textContent = description;

const link = document.createElement("p");
link.textContent = "Explore →";

card.append(heading, paragraph, link);
card.onclick = action;
container.appendChild(card);
}

const branchList = document.getElementById("branchList");

branches.forEach(branch => {
createCard(
branch,
"Explore engineering notes",
() => openBranch(branch),
branchList
);
});

function openBranch(branch) {
selectedBranch = branch;

document.getElementById("schemeHeading").textContent =
branch + " - Select Scheme";

const list = document.getElementById("schemeList");
list.innerHTML = "";

createCard(
"VTU 2022 Scheme",
"1st to 8th Semester",
() => openScheme("2022"),
list
);

createCard(
"VTU 2025 Scheme",
"1st to 4th Semester",
() => openScheme("2025"),
list
);

showPage("schemePage");
}

function openScheme(scheme) {
selectedScheme = scheme;

document.getElementById("semesterHeading").textContent =
selectedBranch + " | " + scheme + " Scheme";

const list = document.getElementById("semesterList");
list.innerHTML = "";

const totalSemesters = scheme === "2022" ? 8 : 4;

for(let i=1; i<=totalSemesters; i++) {
const suffix =
i===1 ? "st" :
i===2 ? "nd" :
i===3 ? "rd" : "th";

createCard(
i + suffix + " Semester",
selectedBranch + " study materials",
() => openSemester(i),
list
);
}

showPage("semesterPage");
}

function openSemester(semester) {
selectedSemester = semester;

document.getElementById("subjectHeading").textContent =
selectedBranch + " | " + selectedScheme +
" Scheme | " + semester + " Semester";

const list = document.getElementById("subjectList");
list.innerHTML = "";

for(let i=1; i<=6; i++) {
const item = document.createElement("div");
item.className = "subject";

const heading = document.createElement("h3");
heading.textContent = "Subject " + i;

const description = document.createElement("p");
description.textContent =
"Subject details and notes will be added here.";

const price = document.createElement("p");
price.className = "price";
price.textContent = "Price: ₹49";

const status = document.createElement("p");
status.className = "note";
status.textContent = "Notes coming soon";

item.append(heading, description, price, status);
list.appendChild(item);
}

showPage("subjectPage");
}

function showPage(page) {
[
"branchPage",
"schemePage",
"semesterPage",
"subjectPage"
].forEach(id => {
document.getElementById(id).classList.add("hidden");
});

document.getElementById(page).classList.remove("hidden");
}

</script>
</body>
</html>
