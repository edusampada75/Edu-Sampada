<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edu Sampada | VTU Notes</title>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #17243a;
}
header {
  background: #142b4a;
  color: white;
  text-align: center;
  padding: 30px 15px;
}
header h1 { margin: 0 0 8px; }
header p { margin: 0; color: #d6e1ef; }
main {
  max-width: 950px;
  margin: 30px auto;
  padding: 0 16px;
}
h2 { margin-bottom: 18px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
}
.card {
  background: white;
  border: 1px solid #dce4ee;
  border-radius: 12px;
  padding: 22px;
  cursor: pointer;
  transition: .2s;
}
.card:hover {
  transform: translateY(-3px);
  border-color: #376da8;
}
.card h3 { margin: 0 0 8px; }
.card p { color: #66758a; margin: 0; font-size: 14px; }
.back {
  border: none;
  background: #e4ebf4;
  padding: 10px 16px;
  border-radius: 7px;
  cursor: pointer;
  margin-bottom: 20px;
  font-size: 14px;
}
.subject {
  background: white;
  border: 1px solid #dce4ee;
  border-radius: 9px;
  padding: 16px;
  margin-bottom: 10px;
}
.muted { color: #718096; }
footer {
  text-align: center;
  padding: 25px;
  color: #718096;
}
</style>
</head>

<body>

<header>
  <h1>EDU SAMPADA</h1>
  <p>VTU Notes | Study Materials | Previous Year Papers</p>
</header>

<main>
  <div id="content"></div>
</main>

<footer>Edu Sampada © 2026</footer>

<script>
const branches = ["ECE", "CSE", "Civil", "Mechanical"];

const semesters2022 = [
  "3rd Semester", "4th Semester", "5th Semester",
  "6th Semester", "7th Semester", "8th Semester"
];

const semesters2025 = [
  "3rd Semester", "4th Semester",
  "5th Semester", "6th Semester",
  "7th Semester", "8th Semester"
];

// Add verified subject lists here as we finalise them.
const subjects = {};

let history = [];

function showPage(title, items, callback, description = "") {
  const content = document.getElementById("content");

  content.innerHTML = `
    ${history.length ? '<button class="back" onclick="goBack()">← Back</button>' : ""}
    <h2>${title}</h2>
    <p class="muted">${description}</p>
    <div class="grid" id="items"></div>
  `;

  const grid = document.getElementById("items");

  items.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<h3>${item}</h3><p>Open ${item}</p>`;
    card.onclick = () => callback(item);
    grid.appendChild(card);
  });
}

function navigate(pageFunction, ...args) {
  history.push(() => pageFunction(...args));
  pageFunction(...args);
}

function goBack() {
  history.pop();
  if (history.length) {
    const previous = history.pop();
    previous();
  } else {
    home();
  }
}

function home() {
  history = [];

  showPage(
    "Welcome to Edu Sampada",
    ["First Year", ...branches],
    item => {
      if (item === "First Year") {
        navigate(firstYear);
      } else {
        navigate(branchPage, item);
      }
    },
    "Select your year or engineering branch"
  );
}

function firstYear() {
  showPage(
    "First Year",
    ["1st Semester", "2nd Semester"],
    semester => navigate(firstYearSubjects, semester),
    "Common first-year section for all four branches"
  );
}

function firstYearSubjects(semester) {
  showSubjectPage("First Year", "Common", semester);
}

function branchPage(branch) {
  showPage(
    branch + " Engineering",
    ["2022 Scheme", "2025 Scheme"],
    scheme => navigate(semesterPage, branch, scheme),
    "Select your VTU scheme"
  );
}

function semesterPage(branch, scheme) {
  showPage(
    branch + " – " + scheme,
    scheme === "2022 Scheme" ? semesters2022 : semesters2025,
    semester => navigate(
      () => showSubjectPage(branch, scheme, semester)
    ),
    "Select your semester"
  );
}

function showSubjectPage(branch, scheme, semester) {
  const key = branch + "|" + scheme + "|" + semester;
  const list = subjects[key] || [];

  const content = document.getElementById("content");

  content.innerHTML = `
    <button class="back" onclick="goBack()">← Back</button>
    <h2>${branch} – ${semester}</h2>
    <p class="muted">${scheme === "Common" ? "First Year" : scheme}</p>
  `;

  if (branch === "ECE" && scheme === "2022 Scheme"
      && semester === "8th Semester") {
    content.innerHTML += `<div class="subject">Coming Soon</div>`;
    return;
  }

  if (list.length === 0) {
    content.innerHTML += `
      <div class="subject">
        Subject list will be added after verification.
      </div>
    `;
    return;
  }

  list.forEach(subject => {
    const div = document.createElement("div");
    div.className = "subject";
    div.textContent = subject.code
      ? subject.code + " – " + subject.name
      : subject.name;
    content.appendChild(div);
  });
}

home();
</script>

</body>
</html>
