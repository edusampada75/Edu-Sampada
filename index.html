<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edu Sampada</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6fa;color:#18304b}
header{background:#102b50;color:white;text-align:center;padding:30px 15px}
header h1{margin:0;font-size:34px;letter-spacing:2px}
header p{color:#d7e5f5}
main{max-width:1000px;margin:30px auto;padding:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}
.card{background:white;padding:22px;border-radius:12px;border:1px solid #e1e7ef;cursor:pointer}
.card:hover{border-color:#276ba5}
.card h3{color:#174d80}
button{background:#174d80;color:white;padding:11px 17px;border:0;border-radius:7px;cursor:pointer}
.subject{background:white;padding:18px;margin:12px 0;border-radius:10px;border:1px solid #e1e7ef}
.hidden{display:none}
.price{color:#16834b;font-weight:bold}
footer{text-align:center;padding:25px;color:#65748b}
</style>
</head>
<body>

<header>
<h1>EDU SAMPADA</h1>
<p>Your Learning Destination</p>
<p>VTU Engineering Notes and Study Materials</p>
</header>

<main>

<section id="branchPage">
<h2>Select Your Engineering Branch</h2>
<div class="grid" id="branches"></div>
</section>

<section id="semesterPage" class="hidden">
<button onclick="back('branchPage')">← Back</button>
<h2 id="branchTitle"></h2>
<div class="grid" id="semesters"></div>
</section>

<section id="subjectPage" class="hidden">
<button onclick="back('semesterPage')">← Back</button>
<h2 id="semesterTitle"></h2>
<div id="subjects"></div>
</section>

</main>

<footer>
<p>© 2026 Edu Sampada. All Rights Reserved.</p>
<p>Learn Better. Achieve More.</p>
</footer>

<script>

const branches = [
"ECE",
"CSE",
"Civil Engineering",
"Mechanical Engineering"
];

let selectedBranch = "";
let selectedSemester = 0;

const branchBox = document.getElementById("branches");

branches.forEach(branch => {
const card = document.createElement("div");
card.className = "card";
card.innerHTML = `
<h3>${branch}</h3>
<p>8 Separate Semesters</p>
<p>Explore Notes →</p>`;
card.onclick = () => openBranch(branch);
branchBox.appendChild(card);
});

function openBranch(branch) {
selectedBranch = branch;

show("semesterPage");

document.getElementById("branchTitle").textContent =
branch + " - Select Semester";

const box = document.getElementById("semesters");
box.innerHTML = "";

for(let i=1;i<=8;i++) {
const suffix = i===1?"st":i===2?"nd":i===3?"rd":"th";

const card = document.createElement("div");
card.className = "card";
card.innerHTML = `
<h3>${i}${suffix} Semester</h3>
<p>${branch} Notes</p>
<p>View Subjects →</p>`;
card.onclick = () => openSemester(i);
box.appendChild(card);
}
}

function openSemester(semester) {
selectedSemester = semester;

show("subjectPage");

document.getElementById("semesterTitle").textContent =
selectedBranch + " - " + semester + " Semester";

const box = document.getElementById("subjects");
box.innerHTML = "";

for(let i=1;i<=6;i++) {
const item = document.createElement("div");
item.className = "subject";

item.innerHTML = `
<h3>Subject ${i}</h3>
<p>Study materials and PDF notes will be available here.</p>
<p class="price">₹49</p>
<button onclick="alert('Notes will be uploaded soon!')">
View Notes
</button>`;

box.appendChild(item);
}
}

function show(page) {
["branchPage","semesterPage","subjectPage"].forEach(id => {
document.getElementById(id).classList.add("hidden");
});
document.getElementById(page).classList.remove("hidden");
}

function back(page) {
show(page);
}

</script>
</body>
</html>
