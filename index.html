<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edu Sampada | VTU Study Materials</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #263248;
}

header {
  background: #172b4d;
  color: white;
  padding: 20px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.logo {
  font-size: 25px;
  font-weight: bold;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
}

.hero {
  text-align: center;
  padding: 65px 20px;
  background: #e7efff;
}

.hero h1 {
  font-size: 36px;
  color: #172b4d;
  margin-bottom: 15px;
}

.hero p {
  color: #53647d;
  font-size: 17px;
}

.search {
  display: block;
  width: 85%;
  max-width: 500px;
  padding: 14px;
  margin: 25px auto 0;
  border: 1px solid #ccd5e2;
  border-radius: 8px;
  font-size: 16px;
}

.container {
  width: 90%;
  max-width: 1100px;
  margin: 35px auto;
}

.section-title {
  margin-bottom: 20px;
  color: #172b4d;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.06);
  cursor: pointer;
  transition: 0.2s;
  border: 1px solid #e5eaf1;
}

.card:hover {
  transform: translateY(-4px);
  border-color: #527de5;
}

.card h3 {
  color: #234b91;
  margin-bottom: 10px;
}

.card p {
  color: #68778d;
  font-size: 14px;
}

.btn {
  padding: 11px 18px;
  background: #2859b8;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin: 8px 5px 8px 0;
}

.btn:hover {
  background: #173e89;
}

.back {
  background: #64748b;
  color: white;
  padding: 10px 17px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-bottom: 20px;
}

.subject {
  background: white;
  padding: 18px;
  margin: 12px 0;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
}

.subject h3 {
  color: #234b91;
  margin-bottom: 8px;
}

.scheme {
  padding: 12px;
  margin: 15px 0;
  border-radius: 6px;
  border: 1px solid #cbd5e1;
  font-size: 15px;
}

footer {
  text-align: center;
  background: #172b4d;
  color: white;
  padding: 25px;
  margin-top: 60px;
}

.hidden {
  display: none;
}

@media(max-width:600px) {
  .hero h1 {
    font-size: 27px;
  }

  header {
    justify-content: center;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Edu Sampada</div>
  <nav>
    <a href="#" onclick="home();return false;">Home</a>
    <a href="#notes">VTU Notes</a>
  </nav>
</header>

<section class="hero">
  <h1>Welcome to Edu Sampada</h1>
  <p>Your learning destination for VTU notes and study materials.</p>
  <input
    class="search"
    id="searchBox"
    type="text"
    placeholder="Search branch or semester..."
    oninput="searchItems()">
</section>

<main class="container" id="notes">

  <div id="content">
    <h2 class="section-title">Select Your Engineering Branch</h2>
    <div class="cards" id="branchCards"></div>
  </div>

</main>

<footer>
  <h3>Edu Sampada</h3>
  <p>Learn Better. Grow Further.</p>
  <p>VTU Study Materials</p>
</footer>

<script>

const branches = ["ECE", "CSE", "Civil", "Mechanical"];

const semesters = [
  "1st Semester",
  "2nd Semester",
  "3rd Semester",
  "4th Semester",
  "5th Semester",
  "6th Semester",
  "7th Semester",
  "8th Semester"
];

let currentBranch = "";
let currentSemester = "";
let currentScheme = "2022";

const content = document.getElementById("content");

function home() {
  document.getElementById("searchBox").value = "";
  showBranches();
}

function showBranches() {
  content.innerHTML = `
    <h2 class="section-title">Select Your Engineering Branch</h2>
    <div class="cards" id="branchCards"></div>
  `;

  const cards = document.getElementById("branchCards");

  branches.forEach(branch => {
    cards.innerHTML += `
      <div class="card" onclick="showSemesters('${branch}')">
        <h3>${branch}</h3>
        <p>View semesters and study materials</p>
        <br>
        <button class="btn">Explore</button>
      </div>
    `;
  });
}

function showSemesters(branch) {
  currentBranch = branch;

  content.innerHTML = `
    <button class="back" onclick="showBranches()">← Back</button>
    <h2 class="section-title">${branch} – Select Semester</h2>
    <div class="cards" id="semesterCards"></div>
  `;

  const cards = document.getElementById("semesterCards");

  semesters.forEach(semester => {
    cards.innerHTML += `
      <div class="card"
        onclick="showSubjects('${semester}')">
        <h3>${semester}</h3>
        <p>${branch} Study Materials</p>
        <br>
        <button class="btn">View Subjects</button>
      </div>
    `;
  });
}

function showSubjects(semester) {
  currentSemester = semester;

  content.innerHTML = `
    <button class="back" onclick="showSemesters('${currentBranch}')">← Back</button>

    <h2 class="section-title">
      ${currentBranch} – ${semester}
    </h2>

    <p>Select VTU Scheme:</p>

    <select class="scheme" id="schemeSelect"
      onchange="changeScheme(this.value)">
      <option value="2022">VTU 2022 Scheme</option>
      <option value="2025">VTU 2025 Scheme</option>
    </select>

    <div id="subjectList"></div>
  `;

  currentScheme = "2022";
  renderSubjects();
}

function changeScheme(scheme) {
  currentScheme = scheme;
  renderSubjects();
}

function firstYearSubjects(semester) {

  const sections = [
    {
      title: "Common Subjects",
      items: [
        "Communicative English",
        "Indian Constitution",
        "Samskrutika Kannada",
        "Innovation and Design Thinking",
        "Scientific Foundations of Health",
        "Computer Aided Engineering Drawing",
        "Professional Writing Skills in English",
        "Balake Kannada"
      ]
    },
    {
      title: "CSE Subjects",
      items: [
        "BMATS101 – Mathematics for CSE Stream-I",
        "BPHYS102 – Physics for CSE Stream",
        "BCHES102 – Chemistry for CSE Stream",
        "BPOPS103 – Principles of Programming Using C",
        "BPLCK105B – Introduction to Python Programming",
        "C Programming"
      ]
    }
  ];

  if (semester === "1st Semester") {
    return sections;
  }

  return [];
}

function renderSubjects() {

  const list = document.getElementById("subjectList");

  if (!list) return;

  list.innerHTML = "";

  if (currentScheme === "2025") {
    list.innerHTML = `
      <div class="subject">
        <h3>VTU 2025 Scheme</h3>
        <p>Subject lists and notes will be added after syllabus verification.</p>
      </div>
    `;
    return;
  }

  let sections = [];

  if (currentBranch === "CSE" &&
      (currentSemester === "1st Semester" ||
       currentSemester === "2nd Semester")) {

    sections = firstYearSubjects(currentSemester);

  }

  if (sections.length === 0) {
    list.innerHTML = `
      <div class="subject">
        <h3>${currentBranch} – ${currentSemester}</h3>
        <p>Subjects and study materials will be added soon.</p>
      </div>
    `;
    return;
  }

  sections.forEach(section => {

    const heading = document.createElement("h2");
    heading.className = "section-title";
    heading.textContent = section.title;

    list.appendChild(heading);

    section.items.forEach(subject => {

      const div = document.createElement("div");
      div.className = "subject";

      const title = document.createElement("h3");
      title.textContent = subject;

      const description = document.createElement("p");
      description.textContent = "VTU 2022 Scheme – Study Materials";

      const preview = document.createElement("button");
      preview.className = "btn";
      preview.textContent = "Preview Notes";

      preview.onclick = function() {
        alert("Notes preview for " + subject + " will be added soon.");
      };

      const unlock = document.createElement("button");
      unlock.className = "btn";
      unlock.textContent = "Unlock Notes – ₹49";

      unlock.onclick = function() {
        alert("Online payment will be connected after setting up the payment system.");
      };

      div.appendChild(title);
      div.appendChild(description);
      div.appendChild(preview);
      div.appendChild(unlock);

      list.appendChild(div);

    });

  });

}

function searchItems() {

  const query = document.getElementById("searchBox")
    .value.toLowerCase();

  const cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    card.style.display =
      card.innerText.toLowerCase().includes(query)
      ? ""
      : "none";
  });

}

showBranches();

</script>

</body>
</html>
